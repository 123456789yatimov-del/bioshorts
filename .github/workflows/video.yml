name: BioShorts

on:
  schedule:
    - cron: "0 1 * * *"   # каждый день в 06:00 по Екатеринбургу
  workflow_dispatch:

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Make and upload video
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          LLM_KEY: ${{ secrets.LLM_KEY }}
          PRIVACY: private
        run: python main.py

      - name: Save progress in topics.json
        run: |
          git config user.name "bioshorts-bot"
          git config user.email "bioshorts-bot@users.noreply.github.com"
          git add topics.json
          git diff --cached --quiet || (git commit -m "Mark topic as done" && git push)
